<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --felt:#0B4F4A; --felt-dark:#073632; --felt-deeper:#052422;
    --gold:#C9A24B; --gold-bright:#E7C978; --cream:#F7F1E3; --ink:#1E2A28;
    --red:#B23A2E; --danger:#E4674B; --ok:#6FBF8B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',sans-serif; color:var(--cream);
    background:radial-gradient(circle at 50% -10%, #0e6a63 0%, var(--felt) 45%, var(--felt-dark) 100%);
    min-height:100vh; background-attachment:fixed;
  }
  h1,h2,h3,.display{ font-family:'Cairo',sans-serif; }
  #app{ max-width:1000px; margin:0 auto; padding:18px 16px 40px; }

  .lattice{
    background-image:
      linear-gradient(45deg, rgba(201,162,75,0.18) 25%, transparent 25%, transparent 75%, rgba(201,162,75,0.18) 75%),
      linear-gradient(45deg, rgba(201,162,75,0.18) 25%, transparent 25%, transparent 75%, rgba(201,162,75,0.18) 75%);
    background-size:14px 14px; background-position:0 0, 7px 7px;
  }

  .header{ text-align:center; margin-bottom:18px; }
  .header .eyebrow{ letter-spacing:.35em; text-transform:uppercase; font-size:11px; color:var(--gold-bright); font-weight:600; opacity:.85; }
  .header h1{ font-size:32px; margin:6px 0 2px; letter-spacing:.02em; color:var(--cream); }
  .header .sub{ font-size:13px; color:rgba(247,241,227,0.6); }

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.12));
    border:1px solid rgba(201,162,75,0.35); border-radius:14px; padding:20px; margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }

  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    border-radius:9px; border:1px solid rgba(201,162,75,0.6);
    padding:10px 16px; cursor:pointer; background:var(--felt-dark); color:var(--gold-bright);
    transition:transform .12s ease, background .15s ease;
  }
  button:hover:not(:disabled){ background:#0e6a63; transform:translateY(-1px); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{ background:var(--gold); color:var(--felt-deeper); border-color:var(--gold); }
  button.primary:hover:not(:disabled){ background:var(--gold-bright); }
  button.ghost{ background:transparent; }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; justify-content:center; }

  label{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold-bright); display:block; margin-bottom:6px;}
  input[type=text], input[type=number], select{
    background:rgba(0,0,0,0.25); border:1px solid rgba(201,162,75,0.4); color:var(--cream);
    border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; width:100%;
    color-scheme: dark;
  }
  .field{ margin-bottom:12px; }
  .botcheck{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; text-transform:none; letter-spacing:0; color:rgba(247,241,227,0.75); }
  .botcheck input{ width:auto; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:520px){ .grid2{ grid-template-columns:1fr; } }

  details.rules{ margin-top:10px; }
  details.rules summary{ cursor:pointer; color:var(--gold-bright); font-weight:600; font-size:13px; }
  details.rules p, details.rules li{ font-size:13px; line-height:1.6; color:rgba(247,241,227,0.85); }

  .playersbar{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
  .chip{ padding:6px 12px; border-radius:20px; border:1px solid rgba(201,162,75,0.4); font-size:12px; background:rgba(0,0,0,0.2); display:flex; align-items:center; gap:6px; }
  .chip.active{ background:var(--gold); color:var(--felt-deeper); font-weight:700; border-color:var(--gold); }
  .chip .dealer-badge{ font-size:10px; opacity:.8;}

  .table-area{ display:flex; justify-content:center; align-items:center; gap:36px; padding:20px 10px; margin-bottom:8px; }
  .pile{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .pile .pile-label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-bright); opacity:.8;}
  .pile .count{ font-size:11px; color:rgba(247,241,227,0.6); text-align:center; max-width:130px;}

  .card{
    width:60px; height:86px; border-radius:8px; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--cream); color:var(--ink); font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,0.35); border:1px solid rgba(0,0,0,0.15);
    user-select:none; flex-shrink:0;
  }
  .card .rank{ font-size:19px; line-height:1; }
  .card .suit{ font-size:17px; line-height:1; margin-top:2px; }
  .card.red{ color:var(--red); }
  .card.joker{ background:linear-gradient(160deg,var(--gold-bright),var(--gold)); color:var(--felt-deeper); }
  .card.joker .rank{ font-size:20px; }
  .card.joker .suit{ font-size:9px; letter-spacing:.15em; }
  .card.back{ background:var(--felt-dark); border:1px solid var(--gold); }
  .card.empty{ background:transparent; border:1px dashed rgba(201,162,75,0.4); box-shadow:none; }
  .card.clickable{ cursor:pointer; }
  .card.clickable:hover{ transform:translateY(-4px); }
  .card.draggable{ cursor:grab; }
  .card.selected{ outline:3px solid var(--gold-bright); outline-offset:2px; transform:translateY(-6px); }
  .card.disabled{ opacity:.5; }
  .card.pickup{ box-shadow:0 0 0 2px var(--danger), 0 3px 8px rgba(0,0,0,0.35); }

  .zone{ border:1px solid rgba(201,162,75,0.3); border-radius:10px; padding:10px; margin:8px 0; background:rgba(0,0,0,0.15); min-height:70px; }
  .zone-label{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-bright); opacity:.8; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .zone-cards{ display:flex; gap:6px; flex-wrap:wrap; min-height:86px; align-items:center; }
  .zone.pool-zone{ background:rgba(0,0,0,0.22); }
  .zone.new-group{ min-height:44px; padding:8px 10px; opacity:.6; font-size:12px; text-align:center; display:flex; align-items:center; justify-content:center; border-style:dashed; }
  .tag{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700; letter-spacing:.05em; }
  .tag.trio, .tag.suivie{ background:rgba(111,191,139,0.2); color:var(--ok); border:1px solid var(--ok); }
  .tag.invalid{ background:rgba(228,103,75,0.15); color:var(--danger); border:1px solid var(--danger); }
  .disband{ font-size:11px; padding:3px 8px; border-radius:6px; }

  .status-line{ font-size:13px; color:rgba(247,241,227,0.75); margin:8px 0; text-align:center;}
  .error-box{ background:rgba(228,103,75,0.15); border:1px solid var(--danger); color:#ffd7cc; padding:10px 14px; border-radius:8px; font-size:13px; margin:10px 0; text-align:center;}
  .notice-box{ background:rgba(201,162,75,0.15); border:1px solid var(--gold); color:var(--gold-bright); padding:10px 14px; border-radius:8px; font-size:13px; margin:10px 0; text-align:center;}

  .pass-screen{ text-align:center; padding:60px 20px; }
  .pass-screen h2{ font-size:26px; margin-bottom:6px; }
  .pass-screen p{ color:rgba(247,241,227,0.7); font-size:13px; margin-bottom:24px;}

  .result-hand{ margin-bottom:18px; }
  .result-hand h3{ font-size:14px; margin-bottom:6px; color:var(--gold-bright); }

  footer.credits{ text-align:center; font-size:11px; color:rgba(247,241,227,0.35); margin-top:24px; }
</style>

<div id="app"></div>

<script>
/* ============================= DATA & HELPERS ============================= */
const SUITS = ['♠','♥','♦','♣'];
const RANK_LABEL = {1:'A',11:'J',12:'Q',13:'K'};
function rankLabel(r){ return RANK_LABEL[r] || String(r); }
function isRed(suit){ return suit==='♥' || suit==='♦'; }

function buildDeck(useJokers){
  let deck = []; let n = 0;
  for(let d=0; d<2; d++){
    for(const s of SUITS){ for(let r=1;r<=13;r++){ deck.push({id:'c'+(n++), suit:s, rank:r, joker:false}); } }
    if(useJokers){ for(let j=0;j<2;j++){ deck.push({id:'c'+(n++), suit:null, rank:null, joker:true}); } }
  }
  return deck; // with jokers: (13*4+2)*2 = 108. without: 13*4*2 = 104
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ============================= MELD ANALYSIS ============================= */
function analyzeGroup(cards){
  const jokers = cards.filter(c=>c.joker);
  const naturals = cards.filter(c=>!c.joker);
  const n = cards.length;
  const result = { trio:false, suivie:false, hasJoker: jokers.length>0 };
  if(jokers.length>1) return result; // at most one joker per combination
  if(naturals.length===0) return result;
  if(n===3 || n===4){
    const rank = naturals[0].rank;
    const sameRank = naturals.every(c=>c.rank===rank);
    const suitSet = new Set(naturals.map(c=>c.suit));
    if(sameRank && suitSet.size===naturals.length){ result.trio = true; }
  }
  if(n>=3){
    const suit = naturals[0].suit;
    const sameSuit = naturals.every(c=>c.suit===suit);
    if(sameSuit){
      const hasAce = naturals.some(c=>c.rank===1);
      const checkRun = (aceHigh)=>{
        const ranks = naturals.map(c => (aceHigh && c.rank===1) ? 14 : c.rank);
        const uniq = new Set(ranks);
        if(uniq.size !== naturals.length) return false; // duplicate rank
        const top = aceHigh ? 14 : 13;
        const minR = Math.min(...ranks), maxR = Math.max(...ranks);
        const sLow = Math.max(1, maxR-n+1), sHigh = Math.min(minR, top-n+1);
        return sLow<=sHigh;
      };
      if(checkRun(false) || (hasAce && checkRun(true))) result.suivie = true;
    }
  }
  return result;
}
function validateFinish(meldGroups, cardsById, handSize){
  handSize = handSize || 14;
  let total=0, hasPureTrio=false, hasPureSuivie=false;
  if(meldGroups.length===0) return {ok:false, reason:'Group your cards into at least one trio and one suivie first.'};
  for(const g of meldGroups){
    if(g.length<3) return {ok:false, reason:'Every group needs at least 3 cards.'};
    const cards = g.map(id=>cardsById[id]);
    total += cards.length;
    const info = analyzeGroup(cards);
    if(!info.trio && !info.suivie) return {ok:false, reason:`One of your groups (${cards.length} cards) isn't a valid trio or suivie.`};
    if(info.trio && !info.hasJoker) hasPureTrio = true;
    if(info.suivie && !info.hasJoker) hasPureSuivie = true;
  }
  if(total!==handSize) return {ok:false, reason:`You must have exactly ${handSize} cards placed in groups (currently ${total}).`};
  if(!hasPureTrio) return {ok:false, reason:'You need at least one trio made entirely without a joker.'};
  if(!hasPureSuivie) return {ok:false, reason:'You need at least one suivie made entirely without a joker.'};
  return {ok:true};
}

/* ============================= 71-MODE CARD VALUES ============================= */
/* 2-10 face value; J/Q/K = 10; Ace = 1 low (A-2-3) or 10 high (paired with K, or with other aces in a trio). */
function rankValue14(r){
  if(r===14) return 10;   // ace resolved high (Q-K-A)
  if(r===1) return 1;     // ace resolved low (A-2-3)
  if(r>=2 && r<=10) return r;
  return 10;               // J, Q, K
}
function comboValue(cards, type){
  const naturals = cards.filter(c=>!c.joker);
  if(naturals.length===0) return 0;
  if(type==='trio'){
    const rank = naturals[0].rank;
    const per = rank===1 ? 10 : rankValue14(rank); // ace trio = paired with aces = 10
    return per * cards.length;
  }
  // suivie
  const n = cards.length;
  const hasAce = naturals.some(c=>c.rank===1);
  function attempt(aceHigh){
    const ranks = naturals.map(c=>(aceHigh && c.rank===1) ? 14 : c.rank);
    const uniq = new Set(ranks);
    if(uniq.size !== naturals.length) return null;
    const top = aceHigh ? 14 : 13;
    const minR = Math.min(...ranks), maxR = Math.max(...ranks);
    const sLow = Math.max(1, maxR-n+1), sHigh = Math.min(minR, top-n+1);
    if(sLow>sHigh) return null;
    const s = sLow;
    let total=0;
    for(let r=s; r<=s+n-1; r++){ total += rankValue14(r); }
    return total;
  }
  const low = attempt(false);
  if(low!==null) return low;
  if(hasAce){ const high = attempt(true); if(high!==null) return high; }
  return 0;
}
/* value of a single leftover card, not part of any laid-down combination */
function standaloneValue(card){
  if(card.joker) return 20; // house-rule default penalty for an unplayed joker
  if(card.rank===1) return 1;
  if(card.rank>=2 && card.rank<=10) return card.rank;
  return 10; // J, Q, K
}


/* ============================= STATE ============================= */
let state = {};
function newSetupState(){ return { screen:'SETUP', numPlayers:4, names:['Player 1','Player 2','Player 3','Player 4'], bots:[false,false,false,false], pointsTarget:500, settings:{ allowDiscardDraw:false, handSize:14, useJokers:true, mode:'complet', openThreshold:71, scoringStyle:'value' } }; }
state = newSetupState();

function startGame(numPlayers, names, bots, pointsTarget, settings){
  const players = names.map((nm,i)=>({ name: nm && nm.trim() ? nm.trim() : 'Player '+(i+1), isBot: !!bots[i], score:0, opened:false, hand: [], arrangement:{pool:[],groups:[]} }));
  let viewIndex = players.findIndex(p=>!p.isBot);
  if(viewIndex===-1) viewIndex = 0;
  state = {
    screen:'GAME', players, dealerIndex:0, currentIndex:0, hasBot: players.some(p=>p.isBot), viewIndex,
    pointsTarget: (Number.isFinite(pointsTarget) && pointsTarget>0) ? pointsTarget : 500, gameOver:false,
    settings: Object.assign({ allowDiscardDraw:false, handSize:14, useJokers:true, mode:'complet', openThreshold:71, scoringStyle:'value' }, settings||{}),
    stock:[], discardPile:[], tournantePending:true, nextAfterDealer: 1 % numPlayers,
    table:[], requiredThreshold:71, allCardsById:{},
    phase:'PASS', pendingAfterPass:'ARRANGE', discardWinAttempt:null,
    selectedCardId:null, errorMsg:null, winner:null, resultMsg:null,
  };
  dealGame();
}

function dealGame(){
  const handSize = state.settings.handSize;
  const deck = shuffle(buildDeck(state.settings.useJokers));
  state.allCardsById = {}; deck.forEach(c=>{ state.allCardsById[c.id]=c; });
  state.players.forEach(p=>{ p.hand=[]; p.arrangement={pool:[],groups:[]}; p.opened=false; });
  const n = state.players.length;
  for(let round=0; round<handSize; round++){ for(let p=0;p<n;p++){ state.players[p].hand.push(deck.pop()); } }
  state.players[state.dealerIndex].hand.push(deck.pop());
  state.players.forEach(p=>{
    p.hand.sort((a,b)=>{ if(a.joker&&b.joker) return 0; if(a.joker) return 1; if(b.joker) return -1; return a.rank-b.rank; });
    p.arrangement.pool = p.hand.map(c=>c.id);
    p.arrangement.groups = [];
  });
  state.stock = deck;
  state.discardPile = [];
  state.table = [];
  state.requiredThreshold = (state.settings.openThreshold===51 ? 51 : 71);
  state.currentIndex = state.dealerIndex;
  state.phase = 'PASS';
  state.pendingAfterPass = 'ARRANGE';
  state.tournantePending = true;
  state.discardWinAttempt = null;
  state.nextAfterDealer = (state.dealerIndex+1) % n;
  state.selectedCardId = null;
  state.errorMsg = null;
  state.winner = null;
  state.resultMsg = null;
  render();
}
function newRound(){ state.dealerIndex=(state.dealerIndex+1)%state.players.length; dealGame(); }
function backToSetup(){ const settings = state.settings; state = newSetupState(); if(settings) state.settings = settings; render(); }


/* ============================= HELPERS ============================= */
function currentPlayer(){ return state.players[state.currentIndex]; }
function currentArrangement(){ return currentPlayer().arrangement; }
function removeFromArrangement(arr, id){
  let idx = arr.pool.indexOf(id);
  if(idx>-1){ arr.pool.splice(idx,1); return; }
  for(const g of arr.groups){ idx=g.indexOf(id); if(idx>-1){ g.splice(idx,1); return; } }
}

/* ============================= TURN ACTIONS ============================= */
function drawFromStock(){
  if(state.phase!=='DRAW' || currentPlayer().isBot) return;
  doStockDraw();
}
function doStockDraw(){
  if(state.stock.length===0){
    if(state.discardPile.length>1){
      const top = state.discardPile.pop();
      state.stock = shuffle(state.discardPile);
      state.discardPile = [top];
    } else {
      state.phase='RESULT'; state.winner=null; state.resultMsg='The stock ran out — the round ends with no winner.'; render(); return;
    }
  }
  const card = state.stock.pop();
  const player = currentPlayer();
  player.hand.push(card);
  player.arrangement.pool.push(card.id);
  if(state.currentIndex===state.nextAfterDealer) state.tournantePending=false;
  state.phase='ARRANGE'; state.selectedCardId=null; state.errorMsg=null;
  render();
}
function drawTournante(){
  if(state.phase!=='DRAW' || currentPlayer().isBot) return;
  if(!(state.tournantePending && state.currentIndex===state.nextAfterDealer && state.discardPile.length>0)) return;
  doTournanteDraw();
}
function doTournanteDraw(){
  const card = state.discardPile.pop();
  const player = currentPlayer();
  player.hand.push(card);
  player.arrangement.pool.push(card.id);
  state.tournantePending=false;
  state.phase='ARRANGE'; state.selectedCardId=null; state.errorMsg=null;
  render();
}
/* "Allow drawing from discard" setting ON: draw from discard freely, any turn, like drawing from stock */
function drawFromDiscardFree(){
  if(state.phase!=='DRAW' || currentPlayer().isBot) return;
  if(!state.settings.allowDiscardDraw) return;
  if(state.discardPile.length===0) return;
  doDiscardFreeDraw();
}
function doDiscardFreeDraw(){
  const card = state.discardPile.pop();
  const player = currentPlayer();
  player.hand.push(card);
  player.arrangement.pool.push(card.id);
  state.tournantePending=false;
  state.phase='ARRANGE'; state.selectedCardId=null; state.errorMsg=null;
  render();
}
/* "Allow drawing from discard" setting OFF (default): pick up the discard pile specifically to
   attempt an immediate win (Complet), or to lay down / close with (71 mode, but only if the player
   already has a joker-free trio and suivie to their name — either sitting in hand ready to lay down,
   or already proven by having opened, since those combos live on the table from then on). */
function hasReadyTrioAndSuivie71(player){
  if(player.opened) return true;
  const cardsById = {}; player.hand.forEach(c=>cardsById[c.id]=c);
  let hasTrio=false, hasSuivie=false;
  player.arrangement.groups.forEach(g=>{
    const info = analyzeGroup(g.map(id=>cardsById[id]));
    if(info.trio && !info.hasJoker) hasTrio=true;
    if(info.suivie && !info.hasJoker) hasSuivie=true;
  });
  return hasTrio && hasSuivie;
}
function attemptDiscardWinDraw(){
  if(state.phase!=='DRAW' || currentPlayer().isBot) return;
  if(state.settings.allowDiscardDraw) return;
  if(state.discardPile.length===0) return;
  if(state.tournantePending && state.currentIndex===state.nextAfterDealer){ drawTournante(); return; }
  const player = currentPlayer();
  if(state.settings.mode==='71' && !hasReadyTrioAndSuivie71(player)) return;
  const card = state.discardPile.pop();
  player.hand.push(card);
  player.arrangement.pool.push(card.id);
  state.discardWinAttempt = card.id;
  state.phase='ARRANGE'; state.selectedCardId=null; state.errorMsg=null;
  render();
}
function returnDiscardCard(){
  if(!state.discardWinAttempt) return;
  const player = currentPlayer();
  const id = state.discardWinAttempt;
  removeFromArrangement(player.arrangement, id);
  const idx = player.hand.findIndex(c=>c.id===id);
  if(idx>-1){ const [card] = player.hand.splice(idx,1); state.discardPile.push(card); }
  player.arrangement.groups = player.arrangement.groups.filter(g=>g.length>0);
  state.discardWinAttempt = null;
  state.phase='DRAW'; state.selectedCardId=null; state.errorMsg=null;
  render();
}

function advanceTurn(){
  state.currentIndex = (state.currentIndex+1)%state.players.length;
  state.selectedCardId=null; state.errorMsg=null; state.discardWinAttempt=null;
  state.phase='PASS'; state.pendingAfterPass='DRAW';
  render();
}

function doDiscard(id){
  const player = currentPlayer();
  if(state.discardWinAttempt){
    if(id===state.discardWinAttempt){ returnDiscardCard(); return; }
    state.errorMsg = 'Finish with the card you picked up, or return it, before discarding anything else.';
    render(); return;
  }
  removeFromArrangement(player.arrangement, id);
  const idx = player.hand.findIndex(c=>c.id===id);
  if(idx===-1) return;
  const [card] = player.hand.splice(idx,1);
  state.discardPile.push(card);
  player.arrangement.groups = player.arrangement.groups.filter(g=>g.length>0);
  advanceTurn();
}

/* A card on the table may belong to any combo; find it. */
function findTableComboIndex(id){
  return state.table.findIndex(combo=>combo.includes(id));
}
/* Would removing `id` from table combo `comboIdx` leave the table valid? Emptying a combo entirely
   is fine (it just disappears); shrinking below 3 cards, or breaking the run/set, is not. */
function canRemoveFromTable(comboIdx, id){
  const combo = state.table[comboIdx];
  if(!combo) return {ok:false};
  const candidate = combo.filter(x=>x!==id);
  if(candidate.length===0) return {ok:true, becomesEmpty:true};
  if(candidate.length<3) return {ok:false};
  const info = analyzeGroup(candidate.map(cid=>state.allCardsById[cid]));
  if(!(info.trio||info.suivie)) return {ok:false};
  return {ok:true, becomesEmpty:false};
}
/* Move a card onto a table combo, whether it came from the player's own hand or from a different
   (or the same) table combo. Rejects the move if either the destination or the depleted source
   combo would end up invalid. */
function moveCardToTable(id, destIdx, beforeId, fromTable, sourceIdx, player){
  const destOriginal = state.table[destIdx];
  if(!destOriginal) return;
  const sameCombo = fromTable && sourceIdx===destIdx;
  let newDest = destOriginal.filter(x=>x!==id);
  if(beforeId){
    const bi = newDest.indexOf(beforeId);
    if(bi>-1) newDest.splice(bi,0,id); else newDest.push(id);
  } else {
    newDest.push(id);
  }
  if(!sameCombo){
    const destInfo = analyzeGroup(newDest.map(cid=>state.allCardsById[cid]));
    if(!(destInfo.trio||destInfo.suivie)){ state.errorMsg="That would break the combination — try a different spot."; render(); return; }
  }
  if(fromTable && !sameCombo){
    const check = canRemoveFromTable(sourceIdx, id);
    if(!check.ok){ state.errorMsg='Removing that card would leave an invalid combination on the table — try somewhere else instead.'; render(); return; }
  }
  if(!fromTable && !player.hand.some(c=>c.id===id)) return;

  state.table[destIdx] = newDest;
  if(fromTable && !sameCombo){
    const srcCombo = state.table[sourceIdx];
    const cidx = srcCombo.indexOf(id);
    if(cidx>-1) srcCombo.splice(cidx,1);
    if(srcCombo.length===0) state.table.splice(sourceIdx,1);
  } else if(!fromTable){
    removeFromArrangement(player.arrangement, id);
    const handIdx = player.hand.findIndex(c=>c.id===id);
    if(handIdx>-1) player.hand.splice(handIdx,1);
  }
  state.errorMsg = null;
  render();
}

/* zoneType: 'pool' | 'group' | 'newgroup' | 'throw' | 'table'. beforeId: insert before this card id, or null/undefined to append at end. */
function performMove(id, zoneType, idx, beforeId){
  if(state.phase!=='ARRANGE' || currentPlayer().isBot) return;
  if(id===beforeId) return;
  const player = currentPlayer();
  if(zoneType==='throw'){ doDiscard(id); return; }

  const sourceTableIdx = findTableComboIndex(id);
  const fromTable = sourceTableIdx>-1;
  const touchesTable = fromTable || zoneType==='table';
  if(touchesTable){
    if(state.settings.mode!=='71') return; // the table only exists in 71 mode
    if(!player.opened){ state.errorMsg = 'Lay down your own combination to open before you can touch the table.'; render(); return; }
  }

  if(zoneType==='table'){ moveCardToTable(id, idx, beforeId, fromTable, sourceTableIdx, player); return; }

  const arr = player.arrangement;
  if(fromTable){
    const check = canRemoveFromTable(sourceTableIdx, id);
    if(!check.ok){ state.errorMsg = 'Removing that card would leave an invalid combination on the table — try somewhere else instead.'; render(); return; }
    const srcCombo = state.table[sourceTableIdx];
    const cidx = srcCombo.indexOf(id);
    srcCombo.splice(cidx,1);
    if(srcCombo.length===0) state.table.splice(sourceTableIdx,1);
    const card = state.allCardsById[id];
    if(card && !player.hand.some(c=>c.id===id)) player.hand.push(card);
  } else {
    removeFromArrangement(arr, id);
  }
  let list;
  if(zoneType==='pool'){ list = arr.pool; }
  else if(zoneType==='group'){ list = arr.groups[idx]; }
  else if(zoneType==='newgroup'){ arr.groups.push([id]); arr.groups = arr.groups.filter(g=>g.length>0); state.errorMsg=null; render(); return; }
  if(!list){ list = []; }
  if(beforeId){
    const bIdx = list.indexOf(beforeId);
    if(bIdx>-1) list.splice(bIdx,0,id); else list.push(id);
  } else {
    list.push(id);
  }
  arr.groups = arr.groups.filter(g=>g.length>0);
  state.errorMsg = null;
  render();
}

/* drag & drop */
function onDragStart(ev, id){ window.__dragId=id; try{ ev.dataTransfer.setData('text/plain', id); ev.dataTransfer.effectAllowed='move'; }catch(e){} }
function allowDrop(ev){ ev.preventDefault(); }
function readDragId(ev){ let id = window.__dragId; if(!id){ try{ id = ev.dataTransfer.getData('text/plain'); }catch(e){} } window.__dragId=null; return id; }
function onDropZone(ev, zoneType, idx){ ev.preventDefault(); const id = readDragId(ev); if(!id) return; performMove(id, zoneType, idx, null); }
function onDropOnCard(ev, zoneType, idx, beforeId){ ev.preventDefault(); ev.stopPropagation(); const id = readDragId(ev); if(!id) return; performMove(id, zoneType, idx, beforeId); }

/* click-to-move */
function onCardClick(ev, zoneType, idx, id){
  ev.stopPropagation();
  if(state.phase!=='ARRANGE' || currentPlayer().isBot) return;
  if(state.selectedCardId && state.selectedCardId!==id){
    const sel = state.selectedCardId; state.selectedCardId=null;
    performMove(sel, zoneType, idx, id);
    return;
  }
  state.selectedCardId = (state.selectedCardId===id) ? null : id;
  render();
}
function zoneClick(zoneType, idx){
  if(state.phase!=='ARRANGE' || currentPlayer().isBot) return;
  if(!state.selectedCardId) return;
  const id = state.selectedCardId; state.selectedCardId = null;
  performMove(id, zoneType, idx, null);
}

function disbandGroup(idx){
  const arr = currentArrangement();
  arr.pool.push(...arr.groups[idx]);
  arr.groups.splice(idx,1);
  render();
}

/* ============================= 71-MODE: SHARED TABLE ACTIONS ============================= */
/* Groups: array of arrays of card ids, each already known to be a valid trio/suivie. Moves them
   from the player's private arrangement onto the shared table, removing the cards from their hand. */
function layDownGroupsToTable(player, groups){
  groups.forEach(g=>{ state.table.push(g.slice()); });
  const movedIds = new Set(groups.flat());
  player.arrangement.groups = player.arrangement.groups.filter(g=>!groups.includes(g));
  player.hand = player.hand.filter(c=>!movedIds.has(c.id));
}
/* total points, and whether at least one pure trio + one pure suivie, among a set of valid groups
   (joker-containing groups don't count toward the opening total). */
function evaluateGroupsForOpening(validGroups, cardsById){
  let total=0, hasTrio=false, hasSuivie=false;
  validGroups.forEach(g=>{
    const cards = g.map(id=>cardsById[id]);
    const info = analyzeGroup(cards);
    if(info.hasJoker) return;
    total += comboValue(cards, info.trio ? 'trio' : 'suivie');
    if(info.trio) hasTrio = true;
    if(info.suivie) hasSuivie = true;
  });
  return { total, hasTrio, hasSuivie };
}
/* Human "Lay Down" button — either opens (first time, needs 71+/threshold, joker-free trio+suivie)
   or, once opened, freely lays down any ready valid groups. */
function tryOpenAndLayDown(){
  if(state.phase!=='ARRANGE' || state.settings.mode!=='71') return;
  const player = currentPlayer();
  if(player.isBot) return;
  const arr = player.arrangement;
  const cardsById = {}; player.hand.forEach(c=>cardsById[c.id]=c);
  const validGroups = arr.groups.filter(g=>{ const info=analyzeGroup(g.map(id=>cardsById[id])); return info.trio||info.suivie; });
  if(validGroups.length===0){ state.errorMsg='Build a valid trio or suivie first.'; render(); return; }
  if(!player.opened){
    const { total, hasTrio, hasSuivie } = evaluateGroupsForOpening(validGroups, cardsById);
    if(!hasTrio || !hasSuivie){ state.errorMsg = 'To open, lay down at least one trio and one suivie, both without any joker.'; render(); return; }
    if(total < state.requiredThreshold){ state.errorMsg = `You need more than ${state.requiredThreshold-1} joker-free points to open — this totals ${total}.`; render(); return; }
    player.opened = true;
    state.requiredThreshold = total;
  }
  layDownGroupsToTable(player, validGroups);
  state.discardWinAttempt = null;
  state.errorMsg = null;
  render();
}
/* going out in 71 mode: hand must be down to exactly the one face-down closing card, and the
   player must have opened. Scores every other player on their leftover hand (or a flat 100 if
   they never opened), doubled for everyone if the closing card is a joker. */
function closeRound71(){
  if(state.phase!=='ARRANGE' || state.settings.mode!=='71') return;
  const player = currentPlayer();
  const arr = player.arrangement;
  if(!player.opened){ if(!player.isBot){ state.errorMsg='You need to open (lay down more than the table\'s threshold) before you can close.'; render(); } return; }
  if(arr.groups.length>0){ if(!player.isBot){ state.errorMsg='Lay down or break up your remaining groups before closing.'; render(); } return; }
  if(arr.pool.length!==1){ if(!player.isBot){ state.errorMsg = `You still have ${arr.pool.length} loose card(s) to place before closing.`; render(); } return; }
  const lastId = arr.pool[0];
  const card = player.hand.find(c=>c.id===lastId);
  const isJokerClose = !!(card && card.joker);
  player.hand = player.hand.filter(c=>c.id!==lastId);
  arr.pool = [];
  const deltas = state.players.map(()=>0);
  state.players.forEach((p,i)=>{
    if(i===state.currentIndex) return;
    let pts;
    if(!p.opened){ pts = 100; }
    else if(state.settings.scoringStyle==='flat10'){ pts = p.hand.length * 10; }
    else { pts = 0; p.hand.forEach(c=>{ pts += standaloneValue(c); }); }
    if(isJokerClose) pts *= 2;
    deltas[i] = pts;
    p.score = (p.score||0) + pts;
  });
  state.lastRoundDeltas = deltas;
  state.winner = state.currentIndex;
  state.finishWasJoker = isJokerClose;
  state.roundPoints = null;
  state.errorMsg = null;
  state.discardWinAttempt = null;
  state.gameOver = state.players.some(p=>(p.score||0) >= state.pointsTarget);
  state.phase = 'RESULT';
  render();
}

function tryFinish(){
  const player = currentPlayer();
  const arr = player.arrangement;
  const nonEmptyGroups = arr.groups.filter(g=>g.length>0);
  const cardsById = {}; player.hand.forEach(c=>cardsById[c.id]=c);

  function fail(msg){
    state.errorMsg = msg;
    player.score = (player.score||0) + 50;
    if(player.score >= state.pointsTarget){
      state.gameOver = true;
      state.winner = null;
      state.resultMsg = null;
      state.phase = 'RESULT';
    }
    render();
  }

  if(arr.pool.length!==1){
    fail(`Leave exactly 1 card ungrouped to throw face down — you currently have ${arr.pool.length} loose. (−50 pts penalty for a wrong Finish)`);
    return;
  }
  const check = validateFinish(nonEmptyGroups, cardsById, state.settings.handSize);
  if(!check.ok){ fail(check.reason + ' (−50 pts penalty for a wrong Finish)'); return; }
  if(state.discardWinAttempt){
    const pickupId = state.discardWinAttempt;
    let hasPureTrioExcl = false, hasPureSuivieExcl = false;
    for(const g of nonEmptyGroups){
      if(g.includes(pickupId)) continue;
      const info = analyzeGroup(g.map(id=>cardsById[id]));
      if(info.trio && !info.hasJoker) hasPureTrioExcl = true;
      if(info.suivie && !info.hasJoker) hasPureSuivieExcl = true;
    }
    if(!hasPureTrioExcl || !hasPureSuivieExcl){
      fail('You need a trio and a suivie made without any joker and without the card you just picked up from the discard. (−50 pts penalty for a wrong Finish)');
      return;
    }
  }
  const lastId = arr.pool[0];
  const finishingCard = cardsById[lastId];
  const isJokerFinish = !!finishingCard.joker;
  const idx = player.hand.findIndex(c=>c.id===lastId);
  player.hand.splice(idx,1);
  arr.pool = [];
  state.discardWinAttempt = null;
  const pointsEach = isJokerFinish ? 200 : 100;
  state.players.forEach((p,i)=>{ if(i!==state.currentIndex) p.score = (p.score||0) + pointsEach; });
  state.winner = state.currentIndex;
  state.finishWasJoker = isJokerFinish;
  state.roundPoints = pointsEach;
  state.gameOver = state.players.some(p=>p.score >= state.pointsTarget);
  state.phase='RESULT';
  render();
}

function sortHand(mode){
  const player = currentPlayer();
  const cardsById = {}; player.hand.forEach(c=>cardsById[c.id]=c);
  const suitOrder = {'♠':0,'♥':1,'♦':2,'♣':3};
  player.arrangement.pool.sort((ida,idb)=>{
    const a=cardsById[ida], b=cardsById[idb];
    if(a.joker&&b.joker) return 0;
    if(a.joker) return 1;
    if(b.joker) return -1;
    if(mode==='suit'){ if(suitOrder[a.suit]!==suitOrder[b.suit]) return suitOrder[a.suit]-suitOrder[b.suit]; return a.rank-b.rank; }
    return a.rank!==b.rank ? a.rank-b.rank : suitOrder[a.suit]-suitOrder[b.suit];
  });
  render();
}

/* ============================= BOT LOGIC ============================= */
function extractSuivies(naturals){
  const bySuit = {};
  naturals.forEach(c=>{ (bySuit[c.suit]=bySuit[c.suit]||[]).push(c); });
  const groups=[]; const used=new Set();
  Object.keys(bySuit).forEach(suit=>{
    let list = bySuit[suit].filter(c=>!used.has(c.id));
    const seen=new Set(); list = list.filter(c=>{ if(seen.has(c.rank)) return false; seen.add(c.rank); return true; });
    list.sort((a,b)=>a.rank-b.rank);
    let i=0;
    while(i<list.length){
      let j=i;
      while(j+1<list.length && list[j+1].rank===list[j].rank+1) j++;
      const runLen = j-i+1;
      if(runLen>=3){ const run=list.slice(i,j+1); groups.push(run); run.forEach(c=>used.add(c.id)); }
      i=j+1;
    }
  });
  return { groups, remaining: naturals.filter(c=>!used.has(c.id)) };
}
function extractTrios(naturals){
  const byRank = {};
  naturals.forEach(c=>{ (byRank[c.rank]=byRank[c.rank]||[]).push(c); });
  const groups=[]; const used=new Set();
  Object.values(byRank).forEach(list=>{
    const bySuit={}; list.forEach(c=>{ if(!bySuit[c.suit]) bySuit[c.suit]=c; });
    const distinct = Object.values(bySuit);
    if(distinct.length>=3){ const take=distinct.slice(0,Math.min(4,distinct.length)); groups.push(take); take.forEach(c=>used.add(c.id)); }
  });
  return { groups, remaining: naturals.filter(c=>!used.has(c.id)) };
}
function tryUseJokers(remaining, jokers, groups){
  remaining = remaining.slice(); jokers = jokers.slice();
  let changed = true;
  while(jokers.length>0 && changed){
    changed = false;
    for(let i=0;i<remaining.length && !changed;i++){
      for(let j=i+1;j<remaining.length && !changed;j++){
        const testGroup = [remaining[i], remaining[j], jokers[0]];
        const info = analyzeGroup(testGroup);
        if(info.trio || info.suivie){
          groups.push(testGroup);
          const usedIds = new Set([remaining[i].id, remaining[j].id]);
          remaining = remaining.filter(c=>!usedIds.has(c.id));
          jokers = jokers.slice(1);
          changed = true;
        }
      }
    }
  }
  return { remaining, jokers };
}
function maybeRunBot(){
  if(state.phase==='DRAW'){ setTimeout(botDraw, 650); }
  else if(state.phase==='ARRANGE'){ setTimeout(botArrangeAndAct, 750); }
}
function botDraw(){
  if(state.phase!=='DRAW' || !currentPlayer().isBot) return;
  if(state.settings.allowDiscardDraw){
    if(state.discardPile.length>0 && Math.random()<0.5){ doDiscardFreeDraw(); } else { doStockDraw(); }
    return;
  }
  const eligible = state.tournantePending && state.currentIndex===state.nextAfterDealer && state.discardPile.length>0;
  if(eligible && Math.random()<0.5){ doTournanteDraw(); } else { doStockDraw(); }
}
function botArrangeAndAct(){
  const player = currentPlayer();
  if(state.phase!=='ARRANGE' || !player.isBot) return;
  if(state.settings.mode==='71'){ botArrangeAndAct71(player); return; }
  let naturals = player.hand.filter(c=>!c.joker).slice();
  let jokers = player.hand.filter(c=>c.joker).slice();
  const sr = extractSuivies(naturals);
  let groups = sr.groups.slice();
  const tr = extractTrios(sr.remaining);
  groups = groups.concat(tr.groups);
  const jr = tryUseJokers(tr.remaining, jokers, groups);
  let poolCards = jr.remaining.concat(jr.jokers);
  if(poolCards.length===0 && groups.length>0){
    const g = groups[groups.length-1];
    poolCards.push(g.pop());
    if(g.length===0) groups.pop();
  }
  player.arrangement.groups = groups.map(g=>g.map(c=>c.id));
  player.arrangement.pool = poolCards.map(c=>c.id);
  if(poolCards.length===1){
    const cardsById={}; player.hand.forEach(c=>cardsById[c.id]=c);
    const check = validateFinish(player.arrangement.groups, cardsById, state.settings.handSize);
    if(check.ok){ tryFinish(); return; }
  }
  const toDiscard = poolCards.find(c=>!c.joker) || poolCards[0];
  if(toDiscard){ doDiscard(toDiscard.id); } else { render(); }
}
function botArrangeAndAct71(player){
  let naturals = player.hand.filter(c=>!c.joker).slice();
  let jokers = player.hand.filter(c=>c.joker).slice();
  const sr = extractSuivies(naturals);
  let groups = sr.groups.slice();
  const tr = extractTrios(sr.remaining);
  groups = groups.concat(tr.groups);
  const jr = tryUseJokers(tr.remaining, jokers, groups);
  let poolCards = jr.remaining.concat(jr.jokers);
  player.arrangement.groups = groups.map(g=>g.map(c=>c.id));
  player.arrangement.pool = poolCards.map(c=>c.id);

  const cardsById = {}; player.hand.forEach(c=>cardsById[c.id]=c);
  let validGroups = player.arrangement.groups.filter(g=>{ const info=analyzeGroup(g.map(id=>cardsById[id])); return info.trio||info.suivie; });
  if(validGroups.length>0){
    if(!player.opened){
      const { total, hasTrio, hasSuivie } = evaluateGroupsForOpening(validGroups, cardsById);
      if(hasTrio && hasSuivie && total>=state.requiredThreshold){
        player.opened = true;
        state.requiredThreshold = total;
        layDownGroupsToTable(player, validGroups);
      }
    } else {
      layDownGroupsToTable(player, validGroups);
    }
  }

  const arr = player.arrangement;
  if(player.opened && arr.groups.length===0 && arr.pool.length===1){ closeRound71(); return; }

  const poolNow = arr.pool.map(id=>cardsById[id] || state.allCardsById[id]).filter(Boolean);
  const toDiscard = poolNow.find(c=>!c.joker) || poolNow[0];
  if(toDiscard){ doDiscard(toDiscard.id); } else { render(); }
}

/* ============================= RENDER: CARD ============================= */
function cardHTML(card, opts){
  opts = opts || {};
  const classes = ['card'];
  if(card.joker) classes.push('joker'); else if(isRed(card.suit)) classes.push('red');
  if(opts.selected) classes.push('selected');
  if(opts.clickable) classes.push('clickable');
  if(opts.draggable) classes.push('draggable');
  if(opts.disabled) classes.push('disabled');
  if(opts.pickup) classes.push('pickup');
  let attrs = '';
  if(opts.draggable) attrs += ` draggable="true" ondragstart="onDragStart(event,'${card.id}')"`;
  if(opts.dropTarget){
    const zi = (opts.zoneIdx===undefined || opts.zoneIdx===null) ? 'null' : opts.zoneIdx;
    attrs += ` ondragover="allowDrop(event)" ondrop="onDropOnCard(event,'${opts.zoneType}',${zi},'${card.id}')"`;
  }
  if(opts.onCardClick){
    const zi = (opts.zoneIdx===undefined || opts.zoneIdx===null) ? 'null' : opts.zoneIdx;
    attrs += ` onclick="onCardClick(event,'${opts.zoneType}',${zi},'${card.id}')"`;
  } else if(opts.onclick){
    attrs += ` onclick="${opts.onclick}"`;
  }
  const body = card.joker
    ? `<div class="rank">🃏</div><div class="suit">JOKER</div>`
    : `<div class="rank">${rankLabel(card.rank)}</div><div class="suit">${card.suit}</div>`;
  return `<div class="${classes.join(' ')}" ${attrs} data-id="${card.id}">${body}</div>`;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen==='SETUP'){ app.innerHTML = renderSetup(); attachSetupHandlers(); return; }
  if(state.phase==='RESULT'){ app.innerHTML = renderResultScreen(); return; }
  if(state.hasBot && state.phase==='PASS'){ state.phase = state.pendingAfterPass; }
  if(!state.hasBot && state.phase==='PASS'){ app.innerHTML = renderPassScreen(); return; }
  if(state.hasBot && !currentPlayer().isBot){ state.viewIndex = state.currentIndex; }
  app.innerHTML = renderTable();
  if(currentPlayer().isBot){ maybeRunBot(); }
}

function readSettingsFromDom(){
  const el = (id)=>document.getElementById(id);
  const modeEl = el('gameMode');
  const mode = modeEl && modeEl.value==='71' ? '71' : 'complet';
  const useJokersEl = el('useJokers');
  if(mode==='71'){
    const openThresholdEl = el('openThreshold');
    const scoringStyleEl = el('scoringStyle');
    return {
      mode,
      allowDiscardDraw: false,
      handSize: 14,
      useJokers: useJokersEl ? useJokersEl.value==='yes' : true,
      openThreshold: openThresholdEl && parseInt(openThresholdEl.value,10)===51 ? 51 : 71,
      scoringStyle: scoringStyleEl && scoringStyleEl.value==='flat10' ? 'flat10' : 'value',
    };
  }
  const allowDiscardEl = el('allowDiscardDraw');
  const handSizeEl = el('handSize');
  return {
    mode,
    allowDiscardDraw: allowDiscardEl ? allowDiscardEl.checked : false,
    handSize: handSizeEl && parseInt(handSizeEl.value,10)===13 ? 13 : 14,
    useJokers: useJokersEl ? useJokersEl.value==='yes' : true,
    openThreshold: 71,
    scoringStyle: 'value',
  };
}
function attachSetupHandlers(){
  document.getElementById('numPlayers').onchange = (e)=>{
    const n = parseInt(e.target.value,10);
    const names=[], bots=[];
    for(let i=0;i<n;i++){
      const el=document.getElementById('name-'+i); names.push(el?el.value:'Player '+(i+1));
      const bc=document.getElementById('bot-'+i); bots.push(bc?bc.checked:false);
    }
    const ptEl = document.getElementById('pointsTarget');
    state.pointsTarget = ptEl ? (parseInt(ptEl.value,10)||500) : state.pointsTarget;
    state.settings = readSettingsFromDom();
    state.numPlayers = n; state.names = names; state.bots = bots; render();
  };
  document.getElementById('gameMode').onchange = ()=>{ state.settings = readSettingsFromDom(); render(); };
  document.getElementById('startBtn').onclick = ()=>{
    const n = state.numPlayers; const names=[]; const bots=[];
    for(let i=0;i<n;i++){ names.push(document.getElementById('name-'+i).value); bots.push(document.getElementById('bot-'+i).checked); }

    startGame(n, names, bots, pointsTarget, settings);
  };
}

      : `<h2>${state.resultMsg}</h2>`;
    const hands = state.players.map((p,i)=>{

      const sorted = p.hand.slice().sort((a,b)=>{ if(a.joker&&b.joker)return 0; if(a.joker)return 1; if(b.joker)return -1; return a.rank-b.rank; });
      const cards = sorted.map(c=>cardHTML(c,{})).join('');
      const note = i===state.winner ? 'closed — 0 pts' : (p.opened ? `+${delta} pts` : `never opened — +${delta} pts`);
      return `<div class="result-hand"><h3>${p.name} <span style="color:var(--gold-bright); font-weight:400; font-size:12px;">(${note})</span></h3><div class="zone-cards">${cards || '<span style="opacity:.5;font-size:13px;">no cards left</span>'}</div></div>`;
    }).join('');
    return `
    <div class="header"><div class="eyebrow">Round over</div></div>
    <div class="panel">
      ${winnerText}
      ${hands}
      ${renderScoreboard()}
      <div class="btnrow">
        <button class="primary" onclick="newRound()">Deal next round</button>
        <button class="ghost" onclick="backToSetup()">New game</button>
      </div>
    </div>
    ${renderTableBoard(false)}`;
  }

  const winnerText = state.winner!==null
    ? `<h2 style="color:var(--gold-bright)">🏆 ${state.players[state.winner].name} wins the round!</h2>
       <p class="status-line">${state.finishWasJoker ? 'Finished with a joker as the 15th card — everyone else takes 200 points.' : 'Everyone else takes 100 points.'}</p>`
    : `<h2>${state.resultMsg}</h2>`;
  const hands = state.players.map((p,i)=>{
    if(i===state.winner){
      const cardsById={}; p.hand.forEach(c=>cardsById[c.id]=c);
      const groupsHtml = p.arrangement.groups.filter(g=>g.length>0).map(g=>{
        const cards=g.map(id=>cardsById[id]);
        const info=analyzeGroup(cards);
        const label = info.trio ? 'Trio' : info.suivie ? 'Suivie' : 'Group';
        return `<div class="zone" style="margin:6px 0;"><div class="zone-label"><span class="tag ${info.trio?'trio':info.suivie?'suivie':'invalid'}">${label}</span></div>
          <div class="zone-cards">${cards.map(c=>cardHTML(c,{})).join('')}</div></div>`;
      }).join('');
      return `<div class="result-hand"><h3>${p.name} — winning hand</h3>${groupsHtml}</div>`;
    }
    const sorted = p.hand.slice().sort((a,b)=>{ if(a.joker&&b.joker)return 0; if(a.joker)return 1; if(b.joker)return -1; return a.rank-b.rank; });
    const cards = sorted.map(c=>cardHTML(c,{})).join('');
    return `<div class="result-hand"><h3>${p.name}</h3><div class="zone-cards">${cards || '<span style="opacity:.5;font-size:13px;">no cards left</span>'}</div></div>`;
  }).join('');
  return `
  <div class="header"><div class="eyebrow">Round over</div></div>
  <div class="panel">
    ${winnerText}
    ${hands}
    ${renderScoreboard()}
    <div class="btnrow">
      <button class="primary" onclick="newRound()">Deal next round</button>
      <button class="ghost" onclick="backToSetup()">New game</button>
    </div>
  </div>`;
}

function renderTable(){
  const viewIdx = state.hasBot ? state.viewIndex : state.currentIndex;
  const player = state.players[viewIdx];
  const isTurn = state.currentIndex === viewIdx;
  const waiting = !isTurn;
  const arr = player.arrangement;
  const cardsById = {}; player.hand.forEach(c=>cardsById[c.id]=c);
  const topDiscard = state.discardPile[state.discardPile.length-1];
  const canDraw = isTurn && state.phase==='DRAW';
  const canArrange = isTurn && state.phase==='ARRANGE';
  const mode71 = state.settings.mode==='71';
  const generalDiscardDraw = state.settings.allowDiscardDraw;
  const tournanteEligible = !generalDiscardDraw && canDraw && state.tournantePending && state.currentIndex===state.nextAfterDealer && state.discardPile.length>0;
  const stockClickable = canDraw && !(state.stock.length===0 && state.discardPile.length<=1);
  const freeDiscardDrawable = generalDiscardDraw && canDraw && state.discardPile.length>0;
  const discardWinPossible = !generalDiscardDraw && canDraw && !tournanteEligible && state.discardPile.length>0
    && (state.settings.mode==='complet' || (mode71 && hasReadyTrioAndSuivie71(player)));

  const stockPileHTML = `<div onclick="${stockClickable?'drawFromStock()':''}" style="${stockClickable?'cursor:pointer':''}">${state.stock.length>0 ? backCardHTML() : emptyCardHTML()}</div>`;

  let discardClick = '';
  if(tournanteEligible) discardClick = 'drawTournante()';
  else if(freeDiscardDrawable) discardClick = 'drawFromDiscardFree()';
  else if(discardWinPossible) discardClick = 'attemptDiscardWinDraw()';
  else if(canArrange) discardClick = "zoneClick('throw')";
  const discardDropAttrs = canArrange ? `ondragover="allowDrop(event)" ondrop="onDropZone(event,'throw')"` : '';
  const discardPileHTML = `<div ${discardDropAttrs} onclick="${discardClick}" style="cursor:${discardClick?'pointer':'default'}">${topDiscard ? cardHTML(topDiscard,{}) : emptyCardHTML()}</div>`;

  let discardCountText;
  if(state.discardPile.length===0) discardCountText = 'empty';
  else if(generalDiscardDraw) discardCountText = 'drawable, like the stock';
  else if(state.tournantePending) discardCountText = 'tournante — drawable once';
  else if(mode71) discardCountText = discardWinPossible ? 'pick up to lay down or close' : 'dead pile';
  else discardCountText = 'pick up only to win';

  const poolCards = arr.pool.map(id=>cardsById[id]).filter(Boolean);
  const poolHTML = poolCards.map(c=>cardHTML(c,{
    selected: state.selectedCardId===c.id, pickup: c.id===state.discardWinAttempt,
    clickable: canArrange, draggable: canArrange, dropTarget: canArrange, onCardClick: canArrange, zoneType:'pool'
  })).join('');

  const groupsHTML = arr.groups.map((g,i)=>{
    if(g.length===0) return '';
    const cards = g.map(id=>cardsById[id]).filter(Boolean);
    const info = analyzeGroup(cards);
    const tagClass = info.trio ? 'trio' : info.suivie ? 'suivie' : 'invalid';
    const tagText = info.trio ? ('Trio'+(info.hasJoker?' · joker':'')) : info.suivie ? ('Suivie'+(info.hasJoker?' · joker':'')) : 'Not valid yet';
    const cardsHTML = cards.map(c=>cardHTML(c,{
      selected: state.selectedCardId===c.id, pickup: c.id===state.discardWinAttempt,
      clickable: canArrange, draggable: canArrange, dropTarget: canArrange, onCardClick: canArrange, zoneType:'group', zoneIdx:i
    })).join('');
    const disbandBtn = canArrange ? `<button class="disband" onclick="event.stopPropagation(); disbandGroup(${i})">Ungroup</button>` : '';
    return `<div class="zone" ${canArrange?`ondragover="allowDrop(event)" ondrop="onDropZone(event,'group',${i})" onclick="zoneClick('group',${i})"`:''}>
      <div class="zone-label"><span class="tag ${tagClass}">${tagText}</span>${disbandBtn}</div>
      <div class="zone-cards">${cardsHTML}</div>
    </div>`;
  }).join('');

  let statusLine;
  if(waiting){
    const actor = state.players[state.currentIndex];
    statusLine = `🤖 ${actor.name} is playing — the stock and discard are locked until they finish.`;
  }
  else if(state.phase==='DRAW') statusLine = tournanteEligible
    ? 'Tap the stock to draw a fresh card, or tap the tournante to take it.'
    : freeDiscardDrawable
      ? 'Tap the stock or the discard pile to draw.'
      : discardWinPossible
        ? (mode71 ? 'Tap the stock to draw — or tap the discard pile, since you already have a trio and suivie ready to lay down or close with.' : 'Tap the stock to draw — or tap the discard pile if it would let you finish right now.')
        : 'Tap the stock to draw a card.';
  else if(state.discardWinAttempt) statusLine = mode71
    ? 'You picked up the discard to lay down or close with. Do so now, or return it.'
    : 'You picked up the discard to try to win. Finish now, or return it.';
  else if(mode71) statusLine = player.opened
    ? 'You\'re in — lay down more groups, drag cards onto any combination on the table, or close once you\'re down to your last card.'
    : `Build a trio and a suivie, both without a joker, worth more than ${state.requiredThreshold-1} points, then tap Lay Down to open.`;
  else statusLine = 'Drag cards to arrange them exactly where you want — or tap a card, then tap another card or a zone.';

  const newGroupZone = canArrange ? `<div class="zone new-group" ondragover="allowDrop(event)" ondrop="onDropZone(event,'newgroup')" onclick="zoneClick('newgroup')">+ drag or tap a card here to start a new group</div>` : '';

  let actionButtons = '';
  if(canArrange){
    if(mode71){
      const closeEnabled = player.opened && arr.groups.length===0 && arr.pool.length===1;
      actionButtons = `<div class="btnrow">
        <button class="primary" onclick="tryOpenAndLayDown()">${player.opened ? 'Lay Down' : 'Open (Lay Down)'}</button>
        <button class="primary" onclick="closeRound71()" ${closeEnabled?'':'disabled'}>Close</button>
        ${state.discardWinAttempt ? `<button class="ghost" onclick="returnDiscardCard()">Return picked-up card</button>` : ''}
        <button class="ghost" onclick="sortHand('rank')">Sort by rank</button>
        <button class="ghost" onclick="sortHand('suit')">Sort by suit</button></div>`;
    } else {
      actionButtons = `<div class="btnrow"><button class="primary" onclick="tryFinish()">Finish</button>
        ${state.discardWinAttempt ? `<button class="ghost" onclick="returnDiscardCard()">Return picked-up card</button>` : ''}
        <button class="ghost" onclick="sortHand('rank')">Sort by rank</button>
        <button class="ghost" onclick="sortHand('suit')">Sort by suit</button></div>`;
    }
  }

  return `
  <div class="header"><div class="eyebrow">Rami</div><h1 style="font-size:22px;">${player.name}'s hand</h1></div>
  ${renderPlayersBar()}
  ${renderTableBoard(canArrange && mode71 && player.opened)}
  <div class="panel">
    <div class="table-area">
      <div class="pile"><div class="pile-label">Stock</div>${stockPileHTML}<div class="count">${state.stock.length} left</div></div>
      <div class="pile"><div class="pile-label">Discard</div>${discardPileHTML}<div class="count">${discardCountText}</div></div>
    </div>
    <div class="status-line">${statusLine}</div>
    <div class="zone pool-zone" ${canArrange?`ondragover="allowDrop(event)" ondrop="onDropZone(event,'pool')" onclick="zoneClick('pool')"`:''}>
      <div class="zone-label">Hand<span>${arr.pool.length} loose</span></div>
      <div class="zone-cards">${poolHTML || '<span style="opacity:.5;font-size:12px;">empty</span>'}</div>
    </div>
    ${groupsHTML}
    ${newGroupZone}
    ${state.errorMsg ? `<div class="error-box">${state.errorMsg}</div>` : ''}
    ${actionButtons}
  </div>`;
}

render();
</script>
</body>
</html>
