<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0e6a63"/>
      <stop offset="55%" stop-color="#0B4F4A"/>
      <stop offset="100%" stop-color="#052422"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C978"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- back card, gold lattice edge, rotated behind -->
  <g transform="rotate(-9 256 266)">
    <rect x="146" y="126" width="220" height="300" rx="26" fill="#052422" stroke="url(#gold)" stroke-width="6"/>
  </g>

  <!-- front card -->
  <g transform="rotate(5 256 266)">
    <rect x="146" y="126" width="220" height="300" rx="26" fill="#F7F1E3" stroke="url(#gold)" stroke-width="9"/>

    <g transform="translate(256 280)">
      <!-- diamond -->
      <g transform="translate(-64,-2) rotate(-12) scale(0.82)">
        <rect x="-24" y="-24" width="48" height="48" rx="7" transform="rotate(45)" fill="#B23A2E"/>
      </g>
      <!-- heart -->
      <g transform="translate(64,-2) rotate(12) scale(0.82)">
        <path d="M0,30 C-30,5 -30,-20 -12,-28 C-4,-32 0,-24 0,-16 C0,-24 4,-32 12,-28 C30,-20 30,5 0,30 Z" fill="#B23A2E"/>
      </g>
      <!-- spade, largest, centered -->
      <g transform="translate(0,8) scale(1.3)">
        <path d="M0,-30 C-30,-5 -30,20 -12,28 C-4,32 0,24 0,16 C0,24 4,32 12,28 C30,20 30,-5 0,-30 Z
                 M-9,26 L9,26 L15,50 L-15,50 Z" fill="#1E2A28"/>
      </g>
    </g>
  </g>

  <!-- joker star accent -->
  <g transform="translate(396 104)">
    <path d="M0,-24 L7,-7 L24,0 L7,7 L0,24 L-7,7 L-24,0 L-7,-7 Z" fill="url(#gold)"/>
  </g>
</svg>
